<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>📊 即時統計</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  font-family: "Noto Sans TC", Arial, "Microsoft JhengHei", sans-serif;
  background: #0f1f17;
  color: #fff;
  text-align: center;
  padding: 16px;
}

h2 {
  margin: 8px 0 18px;
  font-size: 26px;
  line-height: 1.3;
}

.card {
  background: rgba(255,255,255,0.05);
  border-radius: 16px;
  padding: 20px;
  margin: 15px 0;
  font-size: 24px;
}

.big {
  font-size: 56px;
  line-height: 1.1;
  font-weight: bold;
  color: #00ff99;
  margin-top: 10px;
  word-break: break-all;
}

.small {
  font-size: 14px;
  line-height: 1.6;
  opacity: 0.75;
  margin-top: 8px;
}

.footer {
  margin-top: 18px;
  font-size: 12px;
  opacity: 0.55;
  line-height: 1.6;
}

@media (max-width: 480px) {
  body {
    padding: 12px;
  }

  h2 {
    font-size: 24px;
  }

  .card {
    padding: 18px 14px;
    font-size: 22px;
  }

  .big {
    font-size: 52px;
  }
}

@media (max-width: 360px) {
  h2 {
    font-size: 22px;
  }

  .card {
    font-size: 20px;
  }

  .big {
    font-size: 46px;
  }
}
</style>
</head>

<body>

<h2>📊 即時統計（雲端版）</h2>

<div class="card">
  👥 現場人數
  <div id="current" class="big">0</div>
</div>

<div class="card">
  ⬆️ 入園人數
  <div id="inCount" class="big">--</div>
</div>

<div class="card">
  ⬇️ 離園人數
  <div id="outCount" class="big">--</div>
</div>

<div class="small" id="status">狀態：讀取中...</div>

<div class="footer">
  資料來源：後慈湖驗票／出園紀錄｜自動更新：30 秒
</div>

<script>
const API_URL = "";

function updateUI(data) {
  const current = Number(data.current || 0);
  const inCount = data.inCount ?? "--";
  const outCount = data.outCount ?? "--";

  document.getElementById("current").textContent = current;
  document.getElementById("inCount").textContent = inCount;
  document.getElementById("outCount").textContent = outCount;
  document.getElementById("status").textContent = "狀態：正常";
}

async function loadData() {
  if (!API_URL) {
    updateUI({
      current: 0,
      inCount: "--",
      outCount: "--"
    });
    return;
  }

  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    updateUI(data);
  } catch (e) {
    document.getElementById("status").textContent = "狀態：連線失敗";
  }
}

loadData();
setInterval(loadData, 30000);
</script>

</body>
</html>
