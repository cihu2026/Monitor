<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08143f">
<title>後慈湖｜即時人流監控</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#071126;--bg2:#102a5c;--panel:rgba(10,22,52,.78);--card:rgba(255,255,255,.105);--line:rgba(174,204,255,.28);--text:#f8fbff;--muted:#bfd0ef;--primary:#5bc7ff;--accent:#7b8cff;--success:#4ade80;--warning:#facc15;--danger:#fb7185;--shadow:0 22px 56px rgba(2,8,23,.4);--logo:#5bc7ff}
body[data-theme="graphite"]{--bg:#111827;--bg2:#374151;--panel:rgba(17,24,39,.78);--line:rgba(226,232,240,.24);--muted:#cbd5e1;--primary:#e5e7eb;--accent:#94a3b8;--success:#86efac;--warning:#fde047;--danger:#f87171;--logo:#e5e7eb}
body[data-theme="forest"]{--bg:#042014;--bg2:#0f5132;--panel:rgba(4,32,20,.76);--line:rgba(134,239,172,.26);--muted:#c8f7d4;--primary:#86efac;--accent:#2dd4bf;--success:#bbf7d0;--warning:#facc15;--danger:#fb7185;--logo:#86efac}
body[data-theme="ocean"]{--bg:#03263a;--bg2:#075985;--panel:rgba(3,38,58,.76);--line:rgba(125,211,252,.32);--muted:#d2f4ff;--primary:#7dd3fc;--accent:#2dd4bf;--success:#99f6e4;--warning:#fde68a;--danger:#fb7185;--logo:#7dd3fc}
body[data-theme="amber"]{--bg:#271605;--bg2:#7a4f0e;--panel:rgba(39,22,5,.76);--line:rgba(253,230,138,.28);--muted:#ffeab5;--primary:#fbbf24;--accent:#f97316;--success:#bbf7d0;--warning:#fde047;--danger:#fb7185;--logo:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{min-height:100%;height:100%}body{margin:0;height:100svh;font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 8% 6%,color-mix(in srgb,var(--primary) 22%,transparent),transparent 30%),radial-gradient(circle at 92% 4%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 32%),linear-gradient(145deg,var(--bg),var(--bg2) 54%,#050817);padding:12px;overflow:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);background-size:42px 42px}.container{position:relative;z-index:1;width:min(1080px,100%);height:calc(100svh - 24px);margin:0 auto;display:flex;flex-direction:column;gap:10px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex:0 0 auto}.brand{display:flex;align-items:center;gap:11px;min-width:0}.seal{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--accent));box-shadow:0 12px 26px color-mix(in srgb,var(--primary) 24%,transparent);font-size:22px;font-weight:900;color:#fff;flex:0 0 auto}.kicker{margin:0 0 3px;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.title{margin:0;font-size:clamp(22px,4vw,34px);line-height:1.08;font-weight:900;letter-spacing:.04em;white-space:nowrap}.last-update{margin-top:4px;color:var(--muted);font-size:13px;font-weight:700}.actions{display:grid;justify-items:end;gap:6px;min-width:0}.connection{padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.095);border:1px solid var(--line);color:var(--success);font-size:13px;font-weight:900;white-space:nowrap;box-shadow:0 8px 18px rgba(0,0,0,.16)}.theme-switch{display:flex;justify-content:flex-end;gap:5px;max-width:455px;overflow-x:auto;padding-bottom:1px}.theme-btn{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.09);color:var(--text);font-size:11px;font-weight:900;padding:6px 9px;white-space:nowrap;cursor:pointer}.theme-btn.active{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;box-shadow:0 7px 18px color-mix(in srgb,var(--primary) 22%,transparent)}.panel{position:relative;overflow:hidden;border-radius:26px;background:linear-gradient(180deg,var(--card),rgba(255,255,255,.055));border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(18px)}.panel:before{content:"";position:absolute;inset:1px;border-radius:inherit;border:1px solid rgba(255,255,255,.1);pointer-events:none}.main-card{padding:18px 20px 16px;text-align:center;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center}.main-card:after{content:"LIVE";position:absolute;right:18px;top:14px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.09);color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.12em}.label{position:relative;color:var(--muted);font-weight:900;letter-spacing:.12em;font-size:13px}.count-wrap{position:relative;width:min(100%,330px);margin:9px auto 6px;padding:8px 16px 11px;border-radius:26px;background:linear-gradient(180deg,rgba(2,6,23,.58),rgba(255,255,255,.055));border:1px solid color-mix(in srgb,var(--primary) 34%,transparent)}.count{display:block;font-size:clamp(78px,16vw,138px);line-height:.9;font-weight:900;letter-spacing:.03em;color:var(--primary);text-shadow:0 0 16px color-mix(in srgb,var(--primary) 58%,transparent),0 0 38px color-mix(in srgb,var(--primary) 24%,transparent);font-variant-numeric:tabular-nums}.unit{position:relative;color:var(--muted);font-size:13px;font-weight:800;margin-bottom:11px}.progress-box{position:relative;width:min(100%,740px);margin:0 auto}.progress-container{height:14px;border-radius:999px;background:rgba(2,6,23,.52);overflow:hidden;border:1px solid var(--line)}.progress-bar{width:0%;height:100%;border-radius:999px;background:var(--success);transition:width 900ms ease,background-color 300ms ease;box-shadow:0 0 18px currentColor}.capacity-info{display:flex;justify-content:space-between;gap:8px;margin-top:7px;color:var(--muted);font-size:12px;font-weight:800}.status-pill{display:inline-flex;align-items:center;justify-content:center;margin-top:11px;padding:9px 15px;border-radius:999px;background:rgba(255,255,255,.095);border:1px solid var(--line);font-size:16px;font-weight:900}.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:0 0 auto}.mini-card{position:relative;overflow:hidden;padding:14px 12px;border-radius:22px;background:linear-gradient(180deg,var(--card),rgba(255,255,255,.055));border:1px solid var(--line);backdrop-filter:blur(16px);box-shadow:0 14px 32px rgba(0,0,0,.2);text-align:center}.mini-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at top right,color-mix(in srgb,var(--primary) 10%,transparent),transparent 46%);pointer-events:none}.mini-num{position:relative;margin-top:4px;font-size:clamp(27px,5.2vw,42px);line-height:1;font-weight:900;font-variant-numeric:tabular-nums}.in{color:var(--success);text-shadow:0 0 16px color-mix(in srgb,var(--success) 26%,transparent)}.out{color:var(--danger);text-shadow:0 0 16px color-mix(in srgb,var(--danger) 26%,transparent)}.remain{color:var(--warning);text-shadow:0 0 16px color-mix(in srgb,var(--warning) 26%,transparent)}.footer-note{flex:0 0 auto;color:var(--muted);font-size:11px;font-weight:700;text-align:right}.refresh-btn{position:fixed;right:16px;bottom:16px;width:54px;height:54px;border:none;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-size:25px;font-weight:900;cursor:pointer;box-shadow:0 14px 28px rgba(0,0,0,.34);transition:transform .25s ease;z-index:5}.refresh-btn:active{transform:rotate(120deg) scale(.96)}@media(max-width:760px){body{padding:8px}.container{height:calc(100svh - 16px);gap:8px}.topbar{flex-direction:column;gap:7px}.actions{justify-items:start;width:100%;gap:5px}.theme-switch{justify-content:flex-start;width:100%;max-width:100%}.connection{align-self:flex-start;font-size:12px;padding:6px 10px}.seal{width:44px;height:44px;border-radius:14px;font-size:19px}.kicker{font-size:10px}.title{font-size:clamp(21px,6vw,28px)}.last-update{font-size:12px}.main-card{padding:13px 12px;border-radius:24px}.main-card:after{right:13px;top:11px;font-size:9px}.count-wrap{width:min(100%,280px);padding:6px 12px 9px;border-radius:22px}.count{font-size:clamp(72px,25vw,118px)}.unit{font-size:12px;margin-bottom:8px}.status-pill{font-size:14px;margin-top:8px;padding:8px 12px}.stats-grid{gap:7px}.mini-card{padding:10px 6px;border-radius:18px}.mini-card .label{font-size:10px;letter-spacing:.04em}.mini-num{font-size:clamp(23px,9vw,33px)}.footer-note{font-size:10px}.refresh-btn{width:47px;height:47px;right:11px;bottom:11px;font-size:22px}}@media(max-width:390px){.theme-btn{font-size:10px;padding:6px 8px}.capacity-info{font-size:11px}.title{white-space:normal}.count{font-size:clamp(66px,24vw,104px)}.main-card{padding-top:12px}.stats-grid{grid-template-columns:repeat(3,1fr)}.footer-note{display:none}}
</style>
</head>
<body data-theme="official">
<div class="container">
<header class="topbar"><div class="brand"><div class="seal" id="themeIcon">流</div><div><p class="kicker">HOUCIHU LIVE MONITOR</p><h1 class="title">後慈湖即時人流監控</h1><div class="last-update" id="updateTime">系統連線中...</div></div></div><div class="actions"><div class="connection" id="connectionStatus">● 即時連線</div><div class="theme-switch"><button type="button" class="theme-btn" data-theme="official">深藍正式</button><button type="button" class="theme-btn" data-theme="graphite">石墨專業</button><button type="button" class="theme-btn" data-theme="forest">森林沉穩</button><button type="button" class="theme-btn" data-theme="ocean">湖水清爽</button><button type="button" class="theme-btn" data-theme="amber">暖金識別</button></div></div></header>
<section class="panel main-card"><div class="label">目前場內總人數</div><div class="count-wrap"><span class="count" id="currentCount">0</span></div><div class="unit">人</div><div class="progress-box"><div class="progress-container"><div class="progress-bar" id="progressBar"></div></div><div class="capacity-info"><span>目前負荷</span><span id="capacityPercent">0%</span><span id="capacityMax">上限 200 人</span></div></div><div class="status-pill" id="statusText">狀態：讀取中...</div></section>
<section class="stats-grid"><div class="mini-card"><div class="label">今日入園</div><div class="mini-num in" id="totalIn">--</div></div><div class="mini-card"><div class="label">今日離園</div><div class="mini-num out" id="totalOut">--</div></div><div class="mini-card"><div class="label">可再進入</div><div class="mini-num remain" id="remainCount">--</div></div></section>
<div class="footer-note">資料來源：後慈湖驗票／出園紀錄｜自動更新：30 秒</div>
</div>
<button class="refresh-btn" onclick="fetchData()" title="重新整理">↻</button>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbw63eJnsg0a70IbZXBYWktt8CCDfx0mm_MAwzMRDoxKNNvcT2FTTMpJuU8f3qfqHjo/exec";
const MAX_CAPACITY=200;
const THEME_NAMES={official:{name:"深藍正式",icon:"流"},graphite:{name:"石墨專業",icon:"監"},forest:{name:"森林沉穩",icon:"林"},ocean:{name:"湖水清爽",icon:"湖"},amber:{name:"暖金識別",icon:"控"}};
function normalizeTheme(theme){if(["stitch","bunny","usagi","doraemon","chiikawa"].includes(theme))return "official";if(["bear","labubu","disney"].includes(theme))return "amber";if(theme==="snoopy")return "graphite";if(!THEME_NAMES[theme])return "official";return theme}
function setTheme(theme){theme=normalizeTheme(theme);document.body.setAttribute("data-theme",theme);try{localStorage.setItem("houcihu_pos_theme",theme)}catch(e){}document.querySelectorAll(".theme-btn").forEach(btn=>btn.classList.toggle("active",btn.dataset.theme===theme));const item=THEME_NAMES[theme]||THEME_NAMES.official;document.getElementById("themeIcon").textContent=item.icon;document.querySelector('meta[name="theme-color"]').setAttribute("content",getComputedStyle(document.body).getPropertyValue("--bg").trim()||"#08143f")}
function initTheme(){let theme="official";try{theme=localStorage.getItem("houcihu_pos_theme")||"official"}catch(e){}document.querySelectorAll(".theme-btn").forEach(btn=>{btn.onclick=()=>setTheme(btn.dataset.theme)});setTheme(theme)}
function numberOrZero(v){const n=Number(v);return Number.isFinite(n)?n:0}
async function fetchData(){const updateTimeEl=document.getElementById("updateTime"),countEl=document.getElementById("currentCount"),bar=document.getElementById("progressBar"),statusText=document.getElementById("statusText"),connectionStatus=document.getElementById("connectionStatus");try{updateTimeEl.innerText="⏳ 更新數據中...";connectionStatus.innerText="● 連線中";connectionStatus.style.color="var(--primary)";const res=await fetch(API_URL+"?action=getCount",{cache:"no-store"});const data=await res.json();const current=numberOrZero(data.current);const totalIn=numberOrZero(data.in);const totalOut=numberOrZero(data.out);const remain=Math.max(0,MAX_CAPACITY-current);const percent=Math.floor((current/MAX_CAPACITY)*100);const safePercent=Math.min(percent,100);animateValue("currentCount",numberOrZero(countEl.innerText),current,800);bar.style.width=safePercent+"%";document.getElementById("capacityPercent").innerText=percent+"%";document.getElementById("capacityMax").innerText="上限 "+MAX_CAPACITY+" 人";document.getElementById("totalIn").innerText=totalIn;document.getElementById("totalOut").innerText=totalOut;document.getElementById("remainCount").innerText=remain;if(percent>=90){bar.style.backgroundColor="var(--danger)";statusText.innerText="管制建議：暫停入園";statusText.style.color="var(--danger)"}else if(percent>=70){bar.style.backgroundColor="var(--warning)";statusText.innerText="人流提醒：建議分流控管";statusText.style.color="var(--warning)"}else{bar.style.backgroundColor="var(--success)";statusText.innerText="狀態正常：可維持入園";statusText.style.color="var(--success)"}updateTimeEl.innerText="最後同步："+new Date().toLocaleTimeString("zh-TW",{hour12:false});connectionStatus.innerText="● 即時連線";connectionStatus.style.color="var(--success)"}catch(e){console.error(e);updateTimeEl.innerText="❌ 連線異常，請檢查網路";connectionStatus.innerText="● 連線異常";connectionStatus.style.color="var(--danger)"}}
function animateValue(id,start,end,duration){const obj=document.getElementById(id);if(start===end){obj.innerText=end;return}const range=end-start,startTime=performance.now();function update(now){const progress=Math.min((now-startTime)/duration,1);obj.innerText=Math.round(start+range*progress);if(progress<1)requestAnimationFrame(update)}requestAnimationFrame(update)}
initTheme();window.onload=fetchData;setInterval(fetchData,30000);
</script>
</body>
</html>
