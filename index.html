<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後慈湖｜即時人流監控</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#020617;--bg2:#0f172a;--card:rgba(15,23,42,.78);--line:rgba(148,163,184,.22);--text:#f8fafc;--muted:#94a3b8;--primary:#38bdf8;--success:#22c55e;--warning:#f59e0b;--danger:#ef4444}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Noto Sans TC",sans-serif;color:var(--text);background:radial-gradient(circle at top left,rgba(56,189,248,.25),transparent 35%),radial-gradient(circle at bottom right,rgba(34,197,94,.18),transparent 35%),linear-gradient(135deg,var(--bg1),var(--bg2));padding:22px}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(148,163,184,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.045) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.85),rgba(0,0,0,.15))}.container{position:relative;max-width:960px;margin:0 auto}header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:22px}.title-block{display:flex;align-items:center;gap:14px}.logo{width:52px;height:52px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,#38bdf8,#22c55e);box-shadow:0 12px 30px rgba(56,189,248,.28);font-size:26px}h1{margin:0;font-size:clamp(24px,5vw,36px);font-weight:900;letter-spacing:.04em}.last-update{margin-top:4px;color:var(--muted);font-size:14px}.connection{padding:9px 14px;border-radius:999px;background:rgba(15,23,42,.8);border:1px solid var(--line);color:var(--success);font-weight:700;white-space:nowrap;box-shadow:0 10px 25px rgba(0,0,0,.18)}.main-card{position:relative;overflow:hidden;padding:38px 24px;border-radius:32px;background:var(--card);border:1px solid var(--line);box-shadow:0 28px 80px rgba(0,0,0,.38);backdrop-filter:blur(18px);text-align:center}.main-card:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(56,189,248,.16),transparent 45%),repeating-linear-gradient(0deg,rgba(255,255,255,.035),rgba(255,255,255,.035) 1px,transparent 1px,transparent 7px);pointer-events:none}.label{position:relative;color:var(--muted);font-weight:800;letter-spacing:.16em;font-size:14px}.count{position:relative;display:inline-block;min-width:min(100%,320px);margin:14px 0 8px;padding:8px 24px 12px;border-radius:28px;background:linear-gradient(180deg,rgba(2,6,23,.62),rgba(15,23,42,.28));border:1px solid rgba(56,189,248,.22);font-size:clamp(82px,18vw,150px);line-height:.95;font-weight:900;letter-spacing:.03em;color:var(--primary);text-shadow:0 0 18px rgba(56,189,248,.72),0 0 42px rgba(56,189,248,.34);font-variant-numeric:tabular-nums}.unit{position:relative;color:var(--muted);font-weight:700;margin-bottom:20px}.progress-box{position:relative;width:min(100%,720px);margin:0 auto}.progress-container{height:18px;border-radius:999px;background:rgba(51,65,85,.9);overflow:hidden;border:1px solid rgba(148,163,184,.18)}.progress-bar{width:0%;height:100%;border-radius:999px;background:var(--success);transition:width 900ms ease,background-color 300ms ease;box-shadow:0 0 22px currentColor}.capacity-info{display:flex;justify-content:space-between;margin-top:10px;color:var(--muted);font-size:13px;font-weight:700}.status-pill{display:inline-flex;align-items:center;justify-content:center;margin-top:20px;padding:12px 18px;border-radius:999px;background:rgba(15,23,42,.85);border:1px solid var(--line);font-size:18px;font-weight:900}.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}.mini-card{position:relative;overflow:hidden;padding:22px;border-radius:26px;background:rgba(15,23,42,.74);border:1px solid var(--line);backdrop-filter:blur(16px);box-shadow:0 18px 45px rgba(0,0,0,.25);text-align:center}.mini-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at top right,rgba(56,189,248,.12),transparent 45%);pointer-events:none}.mini-num{position:relative;margin-top:8px;font-size:40px;font-weight:900;font-variant-numeric:tabular-nums}.in{color:var(--success);text-shadow:0 0 18px rgba(34,197,94,.28)}.out{color:var(--danger);text-shadow:0 0 18px rgba(239,68,68,.28)}.remain{color:var(--warning);text-shadow:0 0 18px rgba(245,158,11,.28)}.refresh-btn{position:fixed;right:24px;bottom:24px;width:64px;height:64px;border:none;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#22c55e);color:#020617;font-size:28px;font-weight:900;cursor:pointer;box-shadow:0 18px 36px rgba(0,0,0,.38);transition:transform .25s ease}.refresh-btn:hover{transform:rotate(180deg) scale(1.06)}@media(max-width:640px){body{padding:16px}header{align-items:flex-start;flex-direction:column}.connection{align-self:flex-start}.main-card{padding:34px 18px;border-radius:28px}.count{min-width:0;width:100%;padding:8px 12px 12px}.stats-grid{grid-template-columns:repeat(3,1fr);gap:12px}.mini-card{padding:18px 10px;border-radius:22px}.mini-card .label{font-size:12px;letter-spacing:.08em}.mini-num{font-size:30px}.refresh-btn{width:58px;height:58px;right:18px;bottom:18px}}
</style>
</head>
<body>
<div class="container">
<header><div class="title-block"><div class="logo">⛰️</div><div><h1>後慈湖</h1><div class="last-update" id="updateTime">系統連線中...</div></div></div><div class="connection" id="connectionStatus">● 即時連線</div></header>
<section class="main-card"><div class="label">目前場內總人數</div><div class="count" id="currentCount">0</div><div class="unit">人</div><div class="progress-box"><div class="progress-container"><div class="progress-bar" id="progressBar"></div></div><div class="capacity-info"><span>目前負荷</span><span id="capacityPercent">0%</span><span id="capacityMax">上限 800 人</span></div></div><div class="status-pill" id="statusText">狀態：讀取中...</div></section>
<section class="stats-grid"><div class="mini-card"><div class="label">⬆ 今日入園</div><div class="mini-num in" id="totalIn">--</div></div><div class="mini-card"><div class="label">⬇ 今日離園</div><div class="mini-num out" id="totalOut">--</div></div><div class="mini-card"><div class="label">可再進入</div><div class="mini-num remain" id="remainCount">--</div></div></section>
</div>
<button class="refresh-btn" onclick="fetchData()" title="重新整理">↻</button>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbw63eJnsg0a70IbZXBYWktt8CCDfx0mm_MAwzMRDoxKNNvcT2FTTMpJuU8f3qfqHjo/exec";
const MAX_CAPACITY=800;
function numberOrZero(v){const n=Number(v);return Number.isFinite(n)?n:0}
async function fetchData(){const updateTimeEl=document.getElementById("updateTime"),countEl=document.getElementById("currentCount"),bar=document.getElementById("progressBar"),statusText=document.getElementById("statusText"),connectionStatus=document.getElementById("connectionStatus");try{updateTimeEl.innerText="⏳ 更新數據中...";connectionStatus.innerText="● 連線中";connectionStatus.style.color="var(--primary)";const res=await fetch(API_URL+"?action=getCount",{cache:"no-store"});const data=await res.json();const current=numberOrZero(data.current);const totalIn=numberOrZero(data.in);const totalOut=numberOrZero(data.out);const remain=Math.max(0,MAX_CAPACITY-current);const percent=Math.floor((current/MAX_CAPACITY)*100);const safePercent=Math.min(percent,100);animateValue("currentCount",numberOrZero(countEl.innerText),current,800);bar.style.width=safePercent+"%";document.getElementById("capacityPercent").innerText=percent+"%";document.getElementById("capacityMax").innerText="上限 "+MAX_CAPACITY+" 人";document.getElementById("totalIn").innerText=totalIn;document.getElementById("totalOut").innerText=totalOut;document.getElementById("remainCount").innerText=remain;if(percent>=90){bar.style.backgroundColor="var(--danger)";statusText.innerText="🚨 極度擁擠：立即停止進入";statusText.style.color="var(--danger)"}else if(percent>=70){bar.style.backgroundColor="var(--warning)";statusText.innerText="⚠️ 人流較多：建議緩衝";statusText.style.color="var(--warning)"}else{bar.style.backgroundColor="var(--success)";statusText.innerText="✅ 人流正常";statusText.style.color="var(--success)"}updateTimeEl.innerText="最後同步："+new Date().toLocaleTimeString("zh-TW",{hour12:false});connectionStatus.innerText="● 即時連線";connectionStatus.style.color="var(--success)"}catch(e){console.error(e);updateTimeEl.innerText="❌ 斷開連線，請檢查網路";connectionStatus.innerText="● 連線異常";connectionStatus.style.color="var(--danger)"}}
function animateValue(id,start,end,duration){const obj=document.getElementById(id);if(start===end){obj.innerText=end;return}const range=end-start,startTime=performance.now();function update(now){const progress=Math.min((now-startTime)/duration,1);obj.innerText=Math.round(start+range*progress);if(progress<1)requestAnimationFrame(update)}requestAnimationFrame(update)}
window.onload=fetchData;setInterval(fetchData,30000);
</script>
</body>
</html>
