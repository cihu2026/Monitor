<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f3d">
<title>後慈湖｜即時人流監控</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f3d;--bg2:#102a73;--card:rgba(255,255,255,.13);--line:rgba(154,213,255,.24);--text:#f8fbff;--muted:#c7d9ff;--primary:#41d9ff;--primary2:#3975ff;--accent:#8b5cf6;--success:#86ffb1;--success2:#20b96a;--warning:#ffe66d;--danger:#ff6fa6;--danger2:#d83474;--panel:rgba(6,16,54,.68);--shadow:0 28px 90px rgba(5,10,38,.46)}
body[data-theme="bunny"]{--bg:#3a1237;--bg2:#8b2c72;--line:rgba(255,190,224,.34);--muted:#ffe1f1;--primary:#ff8bd1;--primary2:#fb6fb7;--accent:#ffd1e8;--success:#b9ffda;--success2:#2dd48f;--warning:#ffd166;--danger:#ff6fa6;--danger2:#be185d;--panel:rgba(58,18,55,.68)}
body[data-theme="bear"]{--bg:#332207;--bg2:#7a4f0e;--line:rgba(255,220,128,.34);--muted:#ffeab5;--primary:#ffd166;--primary2:#f59e0b;--accent:#ffb35c;--success:#dcfce7;--success2:#22c55e;--warning:#fde047;--danger:#fb7185;--danger2:#be123c;--panel:rgba(51,34,7,.68)}
body[data-theme="forest"]{--bg:#052719;--bg2:#0f5132;--line:rgba(134,255,177,.3);--muted:#c8f7d4;--primary:#86ffb1;--primary2:#16a34a;--accent:#2dd4bf;--success:#bbf7d0;--success2:#15803d;--warning:#facc15;--danger:#fb7185;--danger2:#be123c;--panel:rgba(5,39,25,.68)}
body[data-theme="ocean"]{--bg:#03263a;--bg2:#075985;--line:rgba(125,211,252,.34);--muted:#d2f4ff;--primary:#7dd3fc;--primary2:#0284c7;--accent:#2dd4bf;--success:#99f6e4;--success2:#0d9488;--warning:#fde68a;--danger:#fb7185;--danger2:#be123c;--panel:rgba(3,38,58,.68)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;font-family:"Noto Sans TC",sans-serif;color:var(--text);background:radial-gradient(circle at 10% 5%,color-mix(in srgb,var(--primary) 34%,transparent),transparent 28%),radial-gradient(circle at 88% 4%,color-mix(in srgb,var(--accent) 32%,transparent),transparent 30%),radial-gradient(circle at 92% 92%,color-mix(in srgb,var(--danger) 18%,transparent),transparent 28%),linear-gradient(145deg,var(--bg),var(--bg2) 50%,#050817);padding:22px;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.42;background-image:radial-gradient(circle,rgba(255,255,255,.72) 1px,transparent 1.8px),radial-gradient(circle,color-mix(in srgb,var(--primary) 70%,transparent) 1px,transparent 1.8px),radial-gradient(circle,color-mix(in srgb,var(--danger) 54%,transparent) 1px,transparent 1.8px);background-size:44px 44px,70px 70px,96px 96px;background-position:0 0,18px 24px,42px 9px}.container{position:relative;z-index:1;max-width:980px;margin:0 auto}header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}.title-block{display:flex;align-items:center;gap:14px}.logo{width:56px;height:56px;display:grid;place-items:center;border-radius:20px;background:linear-gradient(135deg,var(--primary),var(--accent));box-shadow:0 12px 30px color-mix(in srgb,var(--primary) 28%,transparent);font-size:28px}.title-kicker{margin:0 0 3px;color:var(--muted);font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}h1{margin:0;font-size:clamp(24px,5vw,38px);font-weight:900;letter-spacing:.04em;text-shadow:0 10px 28px rgba(0,0,0,.35)}.last-update{margin-top:4px;color:var(--muted);font-size:14px;font-weight:700}.header-actions{display:grid;justify-items:end;gap:8px}.connection{padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.11);border:1px solid var(--line);color:var(--success);font-weight:900;white-space:nowrap;box-shadow:0 10px 25px rgba(0,0,0,.18)}.theme-switch{display:flex;justify-content:flex-end;gap:6px;max-width:410px;overflow-x:auto;padding-bottom:2px}.theme-btn{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-size:12px;font-weight:900;padding:8px 10px;white-space:nowrap;cursor:pointer}.theme-btn.active{background:linear-gradient(135deg,var(--primary),var(--accent));box-shadow:0 8px 20px color-mix(in srgb,var(--primary) 24%,transparent)}.main-card{position:relative;overflow:hidden;padding:38px 24px;border-radius:34px;background:linear-gradient(180deg,var(--card),rgba(255,255,255,.065));border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(20px);text-align:center}.main-card:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 16%,transparent),transparent 45%),repeating-linear-gradient(0deg,rgba(255,255,255,.035),rgba(255,255,255,.035) 1px,transparent 1px,transparent 7px);pointer-events:none}.main-card:after{content:"💙";position:absolute;right:24px;top:18px;font-size:28px;opacity:.5}.label{position:relative;color:var(--muted);font-weight:900;letter-spacing:.16em;font-size:14px}.count{position:relative;display:inline-block;min-width:min(100%,330px);margin:14px 0 8px;padding:8px 24px 12px;border-radius:30px;background:linear-gradient(180deg,rgba(2,6,23,.62),rgba(255,255,255,.06));border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);font-size:clamp(82px,18vw,156px);line-height:.95;font-weight:900;letter-spacing:.03em;color:var(--primary);text-shadow:0 0 18px color-mix(in srgb,var(--primary) 72%,transparent),0 0 42px color-mix(in srgb,var(--primary) 34%,transparent);font-variant-numeric:tabular-nums}.unit{position:relative;color:var(--muted);font-weight:800;margin-bottom:20px}.progress-box{position:relative;width:min(100%,720px);margin:0 auto}.progress-container{height:20px;border-radius:999px;background:rgba(2,6,23,.56);overflow:hidden;border:1px solid var(--line)}.progress-bar{width:0%;height:100%;border-radius:999px;background:var(--success);transition:width 900ms ease,background-color 300ms ease;box-shadow:0 0 22px currentColor}.capacity-info{display:flex;justify-content:space-between;margin-top:10px;color:var(--muted);font-size:13px;font-weight:800}.status-pill{display:inline-flex;align-items:center;justify-content:center;margin-top:20px;padding:12px 18px;border-radius:999px;background:rgba(255,255,255,.11);border:1px solid var(--line);font-size:18px;font-weight:900}.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}.mini-card{position:relative;overflow:hidden;padding:22px;border-radius:28px;background:linear-gradient(180deg,var(--card),rgba(255,255,255,.065));border:1px solid var(--line);backdrop-filter:blur(16px);box-shadow:0 18px 45px rgba(0,0,0,.25);text-align:center}.mini-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at top right,color-mix(in srgb,var(--primary) 14%,transparent),transparent 45%);pointer-events:none}.mini-num{position:relative;margin-top:8px;font-size:42px;font-weight:900;font-variant-numeric:tabular-nums}.in{color:var(--success);text-shadow:0 0 18px color-mix(in srgb,var(--success) 32%,transparent)}.out{color:var(--danger);text-shadow:0 0 18px color-mix(in srgb,var(--danger) 32%,transparent)}.remain{color:var(--warning);text-shadow:0 0 18px color-mix(in srgb,var(--warning) 32%,transparent)}.refresh-btn{position:fixed;right:24px;bottom:24px;width:66px;height:66px;border:none;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-size:28px;font-weight:900;cursor:pointer;box-shadow:0 18px 36px rgba(0,0,0,.38);transition:transform .25s ease;z-index:5}.refresh-btn:hover{transform:rotate(180deg) scale(1.06)}@media(max-width:720px){body{padding:16px}header{flex-direction:column}.header-actions{justify-items:start;width:100%}.theme-switch{justify-content:flex-start;width:100%;max-width:100%}.connection{align-self:flex-start}.main-card{padding:34px 18px;border-radius:30px}.count{min-width:0;width:100%;padding:8px 12px 12px}.stats-grid{grid-template-columns:repeat(3,1fr);gap:12px}.mini-card{padding:18px 10px;border-radius:22px}.mini-card .label{font-size:12px;letter-spacing:.08em}.mini-num{font-size:30px}.refresh-btn{width:58px;height:58px;right:18px;bottom:18px}}@media(max-width:460px){.stats-grid{grid-template-columns:1fr}.mini-num{font-size:38px}.capacity-info{font-size:12px}.status-pill{font-size:16px}.theme-btn{font-size:11px;padding:7px 9px}}
</style>
</head>
<body data-theme="stitch">
<div class="container">
<header><div class="title-block"><div class="logo" id="themeIcon">💙</div><div><p class="title-kicker">Houcihu Live Monitor</p><h1>後慈湖即時人流</h1><div class="last-update" id="updateTime">系統連線中...</div></div></div><div class="header-actions"><div class="connection" id="connectionStatus">● 即時連線</div><div class="theme-switch"><button type="button" class="theme-btn" data-theme="stitch">💙 藍紫</button><button type="button" class="theme-btn" data-theme="bunny">🐰 兔兔</button><button type="button" class="theme-btn" data-theme="bear">🧸 小熊</button><button type="button" class="theme-btn" data-theme="forest">🌿 森林</button><button type="button" class="theme-btn" data-theme="ocean">🐬 海洋</button></div></div></header>
<section class="main-card"><div class="label">目前場內總人數</div><div class="count" id="currentCount">0</div><div class="unit">人</div><div class="progress-box"><div class="progress-container"><div class="progress-bar" id="progressBar"></div></div><div class="capacity-info"><span>目前負荷</span><span id="capacityPercent">0%</span><span id="capacityMax">上限 800 人</span></div></div><div class="status-pill" id="statusText">狀態：讀取中...</div></section>
<section class="stats-grid"><div class="mini-card"><div class="label">⬆ 今日入園</div><div class="mini-num in" id="totalIn">--</div></div><div class="mini-card"><div class="label">⬇ 今日離園</div><div class="mini-num out" id="totalOut">--</div></div><div class="mini-card"><div class="label">可再進入</div><div class="mini-num remain" id="remainCount">--</div></div></section>
</div>
<button class="refresh-btn" onclick="fetchData()" title="重新整理">↻</button>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbw63eJnsg0a70IbZXBYWktt8CCDfx0mm_MAwzMRDoxKNNvcT2FTTMpJuU8f3qfqHjo/exec";
const MAX_CAPACITY=800;
const THEME_NAMES={stitch:{name:"藍紫宇宙",icon:"💙"},bunny:{name:"粉紅兔兔",icon:"🐰"},bear:{name:"蜂蜜小熊",icon:"🧸"},forest:{name:"森林精靈",icon:"🌿"},ocean:{name:"海洋泡泡",icon:"🐬"}};
function setTheme(theme){document.body.setAttribute("data-theme",theme);try{localStorage.setItem("houcihu_pos_theme",theme)}catch(e){}document.querySelectorAll(".theme-btn").forEach(btn=>btn.classList.toggle("active",btn.dataset.theme===theme));const item=THEME_NAMES[theme]||THEME_NAMES.stitch;document.getElementById("themeIcon").textContent=item.icon;document.querySelector('meta[name="theme-color"]').setAttribute("content",getComputedStyle(document.body).getPropertyValue("--bg").trim()||"#0b0f3d")}
function initTheme(){let theme="stitch";try{theme=localStorage.getItem("houcihu_pos_theme")||"stitch"}catch(e){}document.querySelectorAll(".theme-btn").forEach(btn=>{btn.onclick=()=>setTheme(btn.dataset.theme)});setTheme(theme)}
function numberOrZero(v){const n=Number(v);return Number.isFinite(n)?n:0}
async function fetchData(){const updateTimeEl=document.getElementById("updateTime"),countEl=document.getElementById("currentCount"),bar=document.getElementById("progressBar"),statusText=document.getElementById("statusText"),connectionStatus=document.getElementById("connectionStatus");try{updateTimeEl.innerText="⏳ 更新數據中...";connectionStatus.innerText="● 連線中";connectionStatus.style.color="var(--primary)";const res=await fetch(API_URL+"?action=getCount",{cache:"no-store"});const data=await res.json();const current=numberOrZero(data.current);const totalIn=numberOrZero(data.in);const totalOut=numberOrZero(data.out);const remain=Math.max(0,MAX_CAPACITY-current);const percent=Math.floor((current/MAX_CAPACITY)*100);const safePercent=Math.min(percent,100);animateValue("currentCount",numberOrZero(countEl.innerText),current,800);bar.style.width=safePercent+"%";document.getElementById("capacityPercent").innerText=percent+"%";document.getElementById("capacityMax").innerText="上限 "+MAX_CAPACITY+" 人";document.getElementById("totalIn").innerText=totalIn;document.getElementById("totalOut").innerText=totalOut;document.getElementById("remainCount").innerText=remain;if(percent>=90){bar.style.backgroundColor="var(--danger)";statusText.innerText="🚨 極度擁擠：立即停止進入";statusText.style.color="var(--danger)"}else if(percent>=70){bar.style.backgroundColor="var(--warning)";statusText.innerText="⚠️ 人流較多：建議緩衝";statusText.style.color="var(--warning)"}else{bar.style.backgroundColor="var(--success)";statusText.innerText="✅ 人流正常";statusText.style.color="var(--success)"}updateTimeEl.innerText="最後同步："+new Date().toLocaleTimeString("zh-TW",{hour12:false});connectionStatus.innerText="● 即時連線";connectionStatus.style.color="var(--success)"}catch(e){console.error(e);updateTimeEl.innerText="❌ 斷開連線，請檢查網路";connectionStatus.innerText="● 連線異常";connectionStatus.style.color="var(--danger)"}}
function animateValue(id,start,end,duration){const obj=document.getElementById(id);if(start===end){obj.innerText=end;return}const range=end-start,startTime=performance.now();function update(now){const progress=Math.min((now-startTime)/duration,1);obj.innerText=Math.round(start+range*progress);if(progress<1)requestAnimationFrame(update)}requestAnimationFrame(update)}
initTheme();window.onload=fetchData;setInterval(fetchData,30000);
</script>
</body>
</html>
