<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f2a3d">
<title>後慈湖｜即時人流監控</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#08131b;--bg2:#0f2a3d;--panel:#102535cc;--panel2:#17364dcc;--line:rgba(202,226,255,.22);--text:#f7fbff;--muted:#b7c9d8;--blue:#78d7ff;--green:#7cf0a8;--yellow:#ffe08a;--red:#ff7c94;--gold:#d7b46a;--shadow:0 24px 80px rgba(0,0,0,.38)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{min-height:100%}body{margin:0;min-height:100vh;font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:linear-gradient(145deg,var(--bg),var(--bg2) 58%,#071018);padding:24px;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 8%,rgba(120,215,255,.22),transparent 30%),radial-gradient(circle at 86% 12%,rgba(215,180,106,.16),transparent 28%),radial-gradient(circle at 50% 105%,rgba(124,240,168,.12),transparent 34%);opacity:.9}body:after{content:"";position:fixed;left:0;right:0;bottom:0;height:28vh;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(2,8,12,.46)),repeating-linear-gradient(0deg,rgba(255,255,255,.035),rgba(255,255,255,.035) 1px,transparent 1px,transparent 11px);opacity:.7}.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:14px}.mark{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#164760,#0d2939);border:1px solid rgba(255,255,255,.18);box-shadow:0 16px 36px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.18);font-weight:900;letter-spacing:.05em}.mark span{display:block;font-size:18px;color:var(--gold)}.kicker{margin:0 0 4px;color:var(--gold);font-size:12px;font-weight:900;letter-spacing:.18em}.title{margin:0;font-size:clamp(27px,4.5vw,43px);line-height:1.12;font-weight:900;letter-spacing:.04em}.sub{margin-top:7px;color:var(--muted);font-size:14px;font-weight:700}.right-top{display:grid;justify-items:end;gap:8px}.connect{padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.085);border:1px solid var(--line);color:var(--green);font-weight:900;white-space:nowrap}.time{padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:800;white-space:nowrap}.dashboard{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.panel{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),rgba(12,29,42,.72));box-shadow:var(--shadow);backdrop-filter:blur(18px);border-radius:32px;overflow:hidden}.panel:before{content:"";position:absolute;inset:1px;border:1px solid rgba(255,255,255,.1);border-radius:31px;pointer-events:none}.main{padding:34px 28px;text-align:center}.panel-title{position:relative;margin:0;color:var(--muted);font-weight:900;letter-spacing:.16em;font-size:14px}.counter-box{position:relative;width:min(100%,410px);margin:18px auto 10px;padding:18px 20px 20px;border-radius:30px;background:linear-gradient(180deg,rgba(3,15,24,.74),rgba(255,255,255,.045));border:1px solid rgba(120,215,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}.count{display:block;font-size:clamp(92px,18vw,172px);line-height:.9;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--blue);text-shadow:0 0 22px rgba(120,215,255,.55),0 0 54px rgba(120,215,255,.24)}.unit{color:var(--muted);font-size:17px;font-weight:800}.bar-wrap{position:relative;margin:24px auto 0;width:min(100%,760px)}.bar{height:18px;border-radius:999px;background:rgba(3,13,20,.72);border:1px solid rgba(255,255,255,.14);overflow:hidden}.bar-inner{height:100%;width:0%;border-radius:999px;background:var(--green);transition:width .8s ease,background-color .25s ease;box-shadow:0 0 24px currentColor}.cap{display:flex;justify-content:space-between;gap:8px;margin-top:10px;color:var(--muted);font-size:13px;font-weight:800}.status{display:inline-flex;margin-top:22px;padding:13px 18px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.08);font-size:18px;font-weight:900}.side{display:grid;gap:16px}.status-card{padding:24px;border-radius:32px;background:linear-gradient(180deg,var(--panel2),rgba(12,29,42,.66));min-height:180px}.status-label{margin:0 0 10px;color:var(--muted);font-size:13px;font-weight:900;letter-spacing:.12em}.status-main{font-size:31px;line-height:1.25;font-weight:900}.status-desc{margin-top:10px;color:var(--muted);font-size:14px;line-height:1.6;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}.metric{padding:21px 16px;text-align:center}.metric .label{color:var(--muted);font-size:13px;font-weight:900;letter-spacing:.12em}.num{margin-top:8px;font-size:42px;font-weight:900;font-variant-numeric:tabular-nums}.in{color:var(--green)}.out{color:var(--red)}.remain{color:var(--yellow)}.foot{margin-top:12px;color:var(--muted);font-size:12px;font-weight:700;text-align:right}.refresh{position:fixed;right:24px;bottom:24px;width:64px;height:64px;border:0;border-radius:50%;background:linear-gradient(145deg,#1d607d,#133448);color:#fff;font-size:28px;font-weight:900;box-shadow:0 18px 36px rgba(0,0,0,.36);z-index:5}.refresh:active{transform:scale(.96) rotate(80deg)}@media(max-width:860px){body{padding:16px}.top{flex-direction:column}.right-top{justify-items:start}.dashboard{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr)}.main{padding:30px 18px}.counter-box{width:100%;padding:14px 10px 18px}.status-card{min-height:auto}.foot{text-align:left}.refresh{right:18px;bottom:18px;width:58px;height:58px}}@media(max-width:520px){.brand{align-items:flex-start}.mark{width:54px;height:54px}.mark span{font-size:16px}.metrics{grid-template-columns:1fr}.num{font-size:39px}.cap{font-size:12px}.status{font-size:16px}.status-main{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><div class="mark"><span>後慈湖</span></div><div><p class="kicker">OPERATIONS CENTER</p><h1 class="title">即時人流管制看板</h1><div class="sub">現場入園、離園與容量負荷監控</div></div></div><div class="right-top"><div class="connect" id="connectionStatus">● 即時連線</div><div class="time" id="updateTime">系統連線中...</div></div></header>
<section class="dashboard"><div class="panel main"><p class="panel-title">目前場內總人數</p><div class="counter-box"><span class="count" id="currentCount">0</span></div><div class="unit">人</div><div class="bar-wrap"><div class="bar"><div class="bar-inner" id="progressBar"></div></div><div class="cap"><span>目前負荷</span><span id="capacityPercent">0%</span><span id="capacityMax">上限 200 人</span></div></div><div class="status" id="statusText">狀態：讀取中...</div></div><aside class="side"><div class="panel status-card"><p class="status-label">營運判斷</p><div class="status-main" id="operationTitle">資料讀取中</div><div class="status-desc" id="operationDesc">系統會依目前人數自動判斷是否需要分流或暫停入園。</div></div><div class="panel status-card"><p class="status-label">容量設定</p><div class="status-main">200 人</div><div class="status-desc">140 人以上提醒分流，180 人以上建議暫停入園。</div></div></aside></section>
<section class="metrics"><div class="panel metric"><div class="label">今日入園</div><div class="num in" id="totalIn">--</div></div><div class="panel metric"><div class="label">今日離園</div><div class="num out" id="totalOut">--</div></div><div class="panel metric"><div class="label">可再進入</div><div class="num remain" id="remainCount">--</div></div></section>
<div class="foot">資料來源：後慈湖驗票／出園紀錄｜自動更新：30 秒</div>
</div>
<button class="refresh" onclick="fetchData()" title="重新整理">↻</button>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbw63eJnsg0a70IbZXBYWktt8CCDfx0mm_MAwzMRDoxKNNvcT2FTTMpJuU8f3qfqHjo/exec";
const MAX_CAPACITY=200;
function numberOrZero(v){const n=Number(v);return Number.isFinite(n)?n:0}
function setText(id,text){document.getElementById(id).innerText=text}
async function fetchData(){const updateTimeEl=document.getElementById("updateTime"),countEl=document.getElementById("currentCount"),bar=document.getElementById("progressBar"),statusText=document.getElementById("statusText"),connectionStatus=document.getElementById("connectionStatus");try{updateTimeEl.innerText="⏳ 更新數據中...";connectionStatus.innerText="● 連線中";connectionStatus.style.color="var(--blue)";const res=await fetch(API_URL+"?action=getCount",{cache:"no-store"});const data=await res.json();const current=numberOrZero(data.current);const totalIn=numberOrZero(data.in);const totalOut=numberOrZero(data.out);const remain=Math.max(0,MAX_CAPACITY-current);const percent=Math.floor((current/MAX_CAPACITY)*100);const safePercent=Math.min(percent,100);animateValue("currentCount",numberOrZero(countEl.innerText),current,800);bar.style.width=safePercent+"%";setText("capacityPercent",percent+"%");setText("capacityMax","上限 "+MAX_CAPACITY+" 人");setText("totalIn",totalIn);setText("totalOut",totalOut);setText("remainCount",remain);if(percent>=90){bar.style.backgroundColor="var(--red)";statusText.innerText="管制建議：暫停入園";statusText.style.color="var(--red)";setText("operationTitle","建議暫停入園");setText("operationDesc","目前已達高負荷區間，建議現場先停止放行，待離園人數增加後再恢復入園。")}else if(percent>=70){bar.style.backgroundColor="var(--yellow)";statusText.innerText="人流提醒：建議分流控管";statusText.style.color="var(--yellow)";setText("operationTitle","建議分流控管");setText("operationDesc","目前人流較多，建議拉長入園節奏，避免 B 點與園區內部壅塞。") }else{bar.style.backgroundColor="var(--green)";statusText.innerText="狀態正常：可維持入園";statusText.style.color="var(--green)";setText("operationTitle","可維持正常入園");setText("operationDesc","目前場內人數仍在安全負荷內，可維持一般入園節奏。") }updateTimeEl.innerText="最後同步："+new Date().toLocaleTimeString("zh-TW",{hour12:false});connectionStatus.innerText="● 即時連線";connectionStatus.style.color="var(--green)"}catch(e){console.error(e);updateTimeEl.innerText="❌ 連線異常，請檢查網路";connectionStatus.innerText="● 連線異常";connectionStatus.style.color="var(--red)";setText("operationTitle","資料暫時中斷");setText("operationDesc","請檢查現場網路或稍後重新整理。看板恢復連線後會自動更新。")}}
function animateValue(id,start,end,duration){const obj=document.getElementById(id);if(start===end){obj.innerText=end;return}const range=end-start,startTime=performance.now();function update(now){const progress=Math.min((now-startTime)/duration,1);obj.innerText=Math.round(start+range*progress);if(progress<1)requestAnimationFrame(update)}requestAnimationFrame(update)}
window.onload=fetchData;setInterval(fetchData,30000);
</script>
</body>
</html>
