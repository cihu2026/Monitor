<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D6E73">
<title>後慈湖｜即時人流監控</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#18343a;--muted:#6f8588;--paper:#fffdf8;--mist:#eef6f3;--lake:#0D6E73;--lake2:#0B4D57;--pine:#1A7F5A;--gold:#B58A45;--amber:#B7791F;--rose:#C94B63;--line:#d9e8e4;--shadow:0 22px 60px rgba(15,79,95,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{min-height:100%}body{margin:0;min-height:100vh;padding:22px;font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,#f9fcfa 0%,var(--mist) 100%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 8%,rgba(13,110,115,.14),transparent 30%),radial-gradient(circle at 92% 10%,rgba(181,138,69,.13),transparent 26%),radial-gradient(circle at 52% 105%,rgba(26,127,90,.13),transparent 34%)}body:after{content:"";position:fixed;left:0;right:0;bottom:0;height:26vh;background:linear-gradient(180deg,transparent,rgba(13,110,115,.08));pointer-events:none}.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto}.hero{position:relative;overflow:hidden;border-radius:34px;padding:26px;background:linear-gradient(135deg,#0b4d57,#0d6e73 58%,#237f75);color:#fff;box-shadow:var(--shadow)}.hero:before{content:"";position:absolute;right:-80px;bottom:-110px;width:330px;height:230px;border-radius:50%;background:rgba(255,255,255,.13)}.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:linear-gradient(90deg,var(--gold),#e6d3a4,var(--pine))}.hero-row{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.brand{display:flex;align-items:center;gap:15px}.seal{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}.seal span{font-size:17px;font-weight:900;line-height:1.1;letter-spacing:.04em}.kicker{margin:0 0 5px;color:#d9f3ef;font-size:12px;font-weight:900;letter-spacing:.2em}.title{margin:0;font-size:clamp(28px,5vw,46px);line-height:1.08;font-weight:900;letter-spacing:.04em}.subtitle{margin-top:8px;color:#dcefeb;font-size:14px;font-weight:700}.system{display:grid;justify-items:end;gap:8px}.pill{padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);color:#fff;font-size:13px;font-weight:900;white-space:nowrap}.theme-tag{color:#f4e7c8}.content{display:grid;grid-template-columns:1.42fr .88fr;gap:16px;margin-top:16px}.card{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);backdrop-filter:blur(14px);overflow:hidden}.main{padding:32px 30px;text-align:center}.label{margin:0;color:var(--muted);font-size:14px;font-weight:900;letter-spacing:.15em}.count{display:block;margin:14px auto 6px;font-size:clamp(94px,18vw,178px);line-height:.9;font-weight:900;color:var(--lake2);font-variant-numeric:tabular-nums;letter-spacing:.01em;text-shadow:0 14px 34px rgba(13,110,115,.12)}.unit{font-size:17px;color:var(--muted);font-weight:800}.barbox{width:min(100%,740px);margin:24px auto 0}.bar{height:18px;border-radius:999px;background:#edf4f2;border:1px solid var(--line);overflow:hidden}.bar-inner{height:100%;width:0;border-radius:999px;background:var(--pine);transition:width .8s ease,background-color .25s ease}.cap{display:flex;justify-content:space-between;gap:8px;margin-top:10px;color:var(--muted);font-size:13px;font-weight:800}.status{display:inline-flex;margin-top:22px;padding:12px 18px;border-radius:999px;background:#f7fbfa;border:1px solid var(--line);font-size:18px;font-weight:900;color:var(--pine)}.side{display:grid;gap:16px}.advice{padding:24px}.advice h2,.capacity h2{margin:0;color:var(--muted);font-size:13px;font-weight:900;letter-spacing:.14em}.advice-title{margin-top:12px;font-size:30px;line-height:1.25;font-weight:900;color:var(--lake2)}.advice-desc{margin:12px 0 0;color:var(--muted);line-height:1.72;font-size:14px;font-weight:700}.capacity{padding:24px;background:linear-gradient(180deg,#ffffff,#f8fbfa)}.capacity-num{font-size:38px;font-weight:900;color:var(--lake2);margin-top:8px}.capacity-note{margin:8px 0 0;color:var(--muted);line-height:1.7;font-size:14px;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}.metric{padding:22px 16px;text-align:center}.m-label{color:var(--muted);font-size:13px;font-weight:900;letter-spacing:.12em}.num{margin-top:8px;font-size:42px;font-weight:900;font-variant-numeric:tabular-nums}.in{color:var(--pine)}.out{color:var(--rose)}.remain{color:var(--amber)}.foot{margin:13px 2px 0;color:var(--muted);font-size:12px;font-weight:700;text-align:right}.refresh{position:fixed;right:22px;bottom:22px;width:62px;height:62px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--lake),var(--lake2));color:#fff;font-size:27px;font-weight:900;box-shadow:0 16px 34px rgba(13,110,115,.28);z-index:5}.refresh:active{transform:scale(.96) rotate(90deg)}@media(max-width:860px){body{padding:14px}.hero{padding:22px 18px;border-radius:28px}.hero-row{flex-direction:column}.system{justify-items:start}.content{grid-template-columns:1fr}.main{padding:28px 18px}.metrics{grid-template-columns:repeat(3,1fr);gap:10px}.metric{padding:18px 8px;border-radius:24px}.num{font-size:34px}.foot{text-align:left}.refresh{width:56px;height:56px;right:16px;bottom:16px}}@media(max-width:520px){.brand{align-items:flex-start}.seal{width:54px;height:54px}.seal span{font-size:16px}.metrics{grid-template-columns:1fr}.num{font-size:40px}.cap{font-size:12px}.status{font-size:16px}.advice-title{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="hero-row">
      <div class="brand"><div class="seal"><span>後慈湖</span></div><div><p class="kicker">LIVE OPERATIONS BOARD</p><h1 class="title">即時人流監控</h1><div class="subtitle">入園、離園、場內人數與容量負荷即時看板</div></div></div>
      <div class="system"><div class="pill" id="connectionStatus">● 即時連線</div><div class="pill theme-tag">湖畔霧青主題</div><div class="pill" id="updateTime">系統連線中...</div></div>
    </div>
  </section>

  <section class="content">
    <div class="card main">
      <p class="label">目前場內總人數</p>
      <span class="count" id="currentCount">0</span>
      <div class="unit">人</div>
      <div class="barbox"><div class="bar"><div class="bar-inner" id="progressBar"></div></div><div class="cap"><span>目前負荷</span><span id="capacityPercent">0%</span><span id="capacityMax">上限 200 人</span></div></div>
      <div class="status" id="statusText">狀態：讀取中...</div>
    </div>
    <aside class="side">
      <div class="card advice"><h2>營運判斷</h2><div class="advice-title" id="operationTitle">資料讀取中</div><p class="advice-desc" id="operationDesc">系統會依目前人數自動判斷是否需要分流或暫停入園。</p></div>
      <div class="card capacity"><h2>容量設定</h2><div class="capacity-num">200 人</div><p class="capacity-note">140 人以上提醒分流，180 人以上建議暫停入園。</p></div>
    </aside>
  </section>

  <section class="metrics">
    <div class="card metric"><div class="m-label">今日入園</div><div class="num in" id="totalIn">--</div></div>
    <div class="card metric"><div class="m-label">今日離園</div><div class="num out" id="totalOut">--</div></div>
    <div class="card metric"><div class="m-label">可再進入</div><div class="num remain" id="remainCount">--</div></div>
  </section>
  <div class="foot">資料來源：後慈湖驗票／出園紀錄｜自動更新：30 秒</div>
</div>
<button class="refresh" onclick="fetchData()" title="重新整理">↻</button>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbw63eJnsg0a70IbZXBYWktt8CCDfx0mm_MAwzMRDoxKNNvcT2FTTMpJuU8f3qfqHjo/exec";
const MAX_CAPACITY=200;
function numberOrZero(v){const n=Number(v);return Number.isFinite(n)?n:0}
function setText(id,text){document.getElementById(id).innerText=text}
async function fetchData(){const updateTimeEl=document.getElementById("updateTime"),countEl=document.getElementById("currentCount"),bar=document.getElementById("progressBar"),statusText=document.getElementById("statusText"),connectionStatus=document.getElementById("connectionStatus");try{updateTimeEl.innerText="更新數據中...";connectionStatus.innerText="● 連線中";connectionStatus.style.color="#fff";const res=await fetch(API_URL+"?action=getCount",{cache:"no-store"});const data=await res.json();const current=numberOrZero(data.current);const totalIn=numberOrZero(data.in);const totalOut=numberOrZero(data.out);const remain=Math.max(0,MAX_CAPACITY-current);const percent=Math.floor((current/MAX_CAPACITY)*100);const safePercent=Math.min(percent,100);animateValue("currentCount",numberOrZero(countEl.innerText),current,800);bar.style.width=safePercent+"%";setText("capacityPercent",percent+"%");setText("capacityMax","上限 "+MAX_CAPACITY+" 人");setText("totalIn",totalIn);setText("totalOut",totalOut);setText("remainCount",remain);if(percent>=90){bar.style.backgroundColor="var(--rose)";statusText.innerText="管制建議：暫停入園";statusText.style.color="var(--rose)";setText("operationTitle","建議暫停入園");setText("operationDesc","目前已達高負荷區間，建議現場先停止放行，待離園人數增加後再恢復入園。")}else if(percent>=70){bar.style.backgroundColor="var(--amber)";statusText.innerText="人流提醒：建議分流控管";statusText.style.color="var(--amber)";setText("operationTitle","建議分流控管");setText("operationDesc","目前人流較多，建議拉長入園節奏，避免 B 點與園區內部壅塞。") }else{bar.style.backgroundColor="var(--pine)";statusText.innerText="狀態正常：可維持入園";statusText.style.color="var(--pine)";setText("operationTitle","可維持正常入園");setText("operationDesc","目前場內人數仍在安全負荷內，可維持一般入園節奏。") }updateTimeEl.innerText="最後同步："+new Date().toLocaleTimeString("zh-TW",{hour12:false});connectionStatus.innerText="● 即時連線";connectionStatus.style.color="#fff"}catch(e){console.error(e);updateTimeEl.innerText="連線異常，請檢查網路";connectionStatus.innerText="● 連線異常";connectionStatus.style.color="#fff";setText("operationTitle","資料暫時中斷");setText("operationDesc","請檢查現場網路或稍後重新整理。看板恢復連線後會自動更新。")}}
function animateValue(id,start,end,duration){const obj=document.getElementById(id);if(start===end){obj.innerText=end;return}const range=end-start,startTime=performance.now();function update(now){const progress=Math.min((now-startTime)/duration,1);obj.innerText=Math.round(start+range*progress);if(progress<1)requestAnimationFrame(update)}requestAnimationFrame(update)}
window.onload=fetchData;setInterval(fetchData,30000);
</script>
</body>
</html>
