<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>📊 即時統計</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  font-family: "Noto Sans TC", Arial, "Microsoft JhengHei", sans-serif;
  background: #0f1f17;
  color: #fff;
  text-align: center;
  padding: 16px;
}

h2 {
  margin: 8px 0 18px;
  font-size: 26px;
  line-height: 1.3;
}

.card {
  background: rgba(255,255,255,0.05);
  border-radius: 16px;
  padding: 20px;
  margin: 15px 0;
  font-size: 24px;
}

.big {
  font-size: 56px;
  line-height: 1.1;
  font-weight: bold;
  color: #00ff99;
  margin-top: 10px;
  word-break: break-all;
}

.small {
  font-size: 14px;
  line-height: 1.6;
  opacity: 0.75;
  margin-top: 8px;
}

.footer {
  margin-top: 18px;
  font-size: 12px;
  opacity: 0.55;
  line-height: 1.6;
}

@media (max-width: 480px) {
  body {
    padding: 12px;
  }

  h2 {
    font-size: 24px;
  }

  .card {
    padding: 18px 14px;
    font-size: 22px;
  }

  .big {
    font-size: 52px;
  }
}

@media (max-width: 360px) {
  h2 {
    font-size: 22px;
  }

  .card {
    font-size: 20px;
  }

  .big {
    font-size: 46px;
  }
}
</style>
</head>

<body>

<h2>📊 即時統計（雲端版）</h2>

<div class="card">
  👥 現場人數
  <div id="current" class="big">0</div>
</div>

<div class="card">
  ⬆️ 入園人數
  <div id="inCount" class="big">--</div>
</div>

<div class="card">
  ⬇️ 離園人數
  <div id="outCount" class="big">--</div>
</div>

<div class="small" id="status">狀態：讀取中...</div>

<div class="footer">
  資料來源：後慈湖驗票／出園紀錄｜自動更新：30 秒
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbw63eJnsg0a70IbZXBYWktt8CCDfx0mm_MAwzMRDoxKNNvcT2FTTMpJuU8f3qfqHjo/exec?action=getRealtimeStatus";

function firstValue(object, keys, fallback) {
  for (const key of keys) {
    if (object && object[key] !== undefined && object[key] !== null) {
      return object[key];
    }
  }
  return fallback;
}

function updateUI(result) {
  const data = result && result.data ? result.data : result;

  const current = Number(firstValue(data, ["current", "currentPeople", "currentCount"], 0));
  const inCount = firstValue(data, ["inCount", "totalIn", "inTotal"], 0);
  const outCount = firstValue(data, ["outCount", "totalOut", "outTotal"], 0);

  document.getElementById("current").textContent = Number.isFinite(current) ? current : 0;
  document.getElementById("inCount").textContent = inCount;
  document.getElementById("outCount").textContent = outCount;
  document.getElementById("status").textContent =
    "狀態：正常｜更新時間：" +
    new Date().toLocaleTimeString("zh-TW", { hour12: false });
}

async function loadData() {
  const status = document.getElementById("status");
  status.textContent = "狀態：更新中...";

  try {
    const separator = API_URL.includes("?") ? "&" : "?";
    const res = await fetch(API_URL + separator + "_=" + Date.now(), {
      method: "GET",
      cache: "no-store"
    });

    if (!res.ok) {
      throw new Error("HTTP " + res.status);
    }

    const result = await res.json();
    updateUI(result);
  } catch (e) {
    console.error("讀取即時資料失敗：", e);
    status.textContent = "狀態：連線失敗，30 秒後重試";
  }
}

loadData();
setInterval(loadData, 30000);
</script>

</body>
</html>
